<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>DEAD SECTOR: 지하 격리구역</title>

<style>
:root {
  --cyan: #7cecff;
  --panel: rgba(8,13,18,.94);
  --line: rgba(124,236,255,.3);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030609;
  color: #eafaff;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: #eafaff;
  background: #12212a;
  border: 1px solid #3b7180;
  border-radius: 8px;
  padding: 11px 14px;
}

button:hover {
  background: #1b3540;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

#game {
  position: fixed;
  inset: 0;
  display: none;
}

canvas {
  display: block;
  touch-action: none;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  background: radial-gradient(
    ellipse at center,
    #15232b 0,
    #070b10 55%,
    #020304 100%
  );
  padding: 16px;
}

.panel {
  width: min(540px, 100%);
  max-height: 96dvh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 0 45px #000;
  padding: 22px;
  border-radius: 14px;
}

.logo {
  font-size: clamp(28px, 6vw, 46px);
  font-weight: 900;
  letter-spacing: 2px;
  color: #eafaff;
  text-shadow: 0 0 20px #39b8ce;
}

.sub {
  color: #91a9b4;
  font-size: 12px;
  letter-spacing: 3px;
  margin: 4px 0 22px;
}

h2 {
  font-size: 16px;
  margin: 18px 0 9px;
  color: var(--cyan);
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.row > * {
  flex: 1;
  min-width: 0;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #344d58;
  border-radius: 8px;
  background: #080f14;
  color: white;
  margin: 4px 0;
}

.small {
  font-size: 12px;
  color: #8da4af;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

.primary {
  background: #15505b;
  border-color: #54d6e8;
  font-weight: bold;
}

.danger {
  border-color: #9a4248;
}

.roomcode {
  font-size: 32px;
  letter-spacing: 8px;
  text-align: center;
  color: #fff;
  font-weight: bold;
  padding: 12px;
  border: 1px dashed #57a8b8;
  border-radius: 8px;
}

#lobbyPlayers {
  padding: 8px;
  background: #060b0f;
  border-radius: 8px;
  min-height: 42px;
  line-height: 1.9;
}

.playerpill {
  display: inline-block;
  padding: 5px 9px;
  margin: 3px;
  border: 1px solid #34515b;
  border-radius: 6px;
  font-size: 13px;
}

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hudbox {
  position: absolute;
  background: rgba(0,0,0,.55);
  border: 1px solid #31515d;
  border-radius: 7px;
  padding: 10px;
  font-size: 13px;
}

.tl {
  top: 12px;
  left: 12px;
}

.tr {
  top: 12px;
  right: 12px;
  text-align: right;
}

.bottom {
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  min-width: 230px;
}

.crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 10px;
  height: 10px;
  transform: translate(-50%,-50%);
}

.crosshair:before,
.crosshair:after {
  content: "";
  position: absolute;
  background: #d9fbff;
  box-shadow: 0 0 5px #6eefff;
}

.crosshair:before {
  width: 10px;
  height: 1px;
  top: 4px;
}

.crosshair:after {
  width: 1px;
  height: 10px;
  left: 4px;
}

#toast {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  font-weight: bold;
  text-shadow: 0 2px 8px #000;
  color: #c5f9ff;
  font-size: 15px;
  text-align: center;
  width: 90%;
}

#mobileControls {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
  touch-action: none;
}

.joy {
  position: absolute;
  left: 22px;
  bottom: 28px;
  width: 138px;
  height: 138px;
  border: 2px solid #bdefff88;
  border-radius: 50%;
  background: #142a3666;
  pointer-events: auto;
  touch-action: none;
}

.knob {
  position: absolute;
  left: 40px;
  top: 40px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #bdefff88;
  border: 1px solid #d9fbff;
}

.mButtons {
  position: absolute;
  right: 16px;
  bottom: 25px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: auto;
}

.mButtons button {
  width: 66px;
  height: 58px;
  border-radius: 50%;
  background: #10242ccc;
  border-color: #8cd8e8;
  font-size: 12px;
  padding: 4px;
}

.runBtn {
  position: absolute;
  right: 22px;
  bottom: 175px;
  pointer-events: auto;
}

#startOverlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #0009;
  pointer-events: auto;
}

.overlaycard {
  background: #080f14ed;
  border: 1px solid #5c9ca9;
  border-radius: 12px;
  padding: 22px;
  text-align: center;
  max-width: 320px;
}

@media(max-width:700px) {
  .panel {
    padding: 16px;
  }

  .logo {
    font-size: 30px;
  }

  #mobileControls {
    display: block;
  }

  .bottom {
    bottom: 178px;
  }

  .tl {
    font-size: 11px;
    max-width: 62%;
  }

  .tr {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div id="menu">
  <div class="panel">
    <div class="logo">DEAD SECTOR</div>
    <div class="sub">
      지하 격리구역 · CO-OP SURVIVAL HORROR
    </div>

    <section id="characterSection">
      <h2>캐릭터 만들기</h2>

      <div class="row">
        <div>
          <label class="small">캐릭터 이름</label>
          <input id="playerName" maxlength="16" value="생존자">
        </div>

        <div>
          <label class="small">복장</label>
          <select id="outfit">
            <option>보안요원</option>
            <option>연구원</option>
            <option>정비공</option>
            <option>탐사복</option>
          </select>
        </div>
      </div>

      <label class="small">캐릭터 색상</label>

      <div class="row" id="colors">
        <button data-color="#54d6ff">청색</button>
        <button data-color="#ff5757">적색</button>
        <button data-color="#a78bfa">보라</button>
        <button data-color="#ffd166">황색</button>
        <button data-color="#7ee081">녹색</button>
      </div>
    </section>

    <section id="mainMenu">
      <h2>작전실</h2>

      <button class="primary" id="createBtn" style="width:100%">
        새 방 만들기
      </button>

      <h2>방 번호로 참가</h2>

      <div class="row">
        <input id="joinCode" maxlength="5" placeholder="방 번호 5자리">
        <button id="joinBtn">참가하기</button>
      </div>

      <p class="small">
        최대 4명 · 방장은 게임 시작을 누를 수 있습니다.
        혼자서도 플레이할 수 있습니다.
      </p>
    </section>

    <section id="lobbySection" class="hidden">
      <h2>대기실</h2>

      <div class="roomcode" id="roomCode">-----</div>

      <p class="small" style="text-align:center">
        친구에게 방 번호를 알려주세요.
      </p>

      <h2>참가자</h2>
      <div id="lobbyPlayers"></div>
      <p id="hostHint" class="small"></p>

      <div class="row" style="margin-top:12px">
        <button id="startBtn" class="primary">게임 시작</button>
        <button id="leaveBtn" class="danger">방 나가기</button>
      </div>
    </section>

    <p id="menuMessage" class="small" role="status"></p>
  </div>
</div>

<div id="game">
  <div id="hud">
    <div class="hudbox tl">
      <b>DEAD SECTOR</b>
      <div id="missionText">대기 중</div>
      <div id="hpText">체력: 100</div>
    </div>

    <div class="hudbox tr">
      <div>WASD / 터치 이동</div>
      <div>마우스 / 오른쪽 드래그: 시점</div>
      <div>E: 상호작용 · F: 손전등 · Shift: 달리기</div>
    </div>

    <div class="crosshair"></div>
    <div id="toast"></div>

    <div class="hudbox bottom" id="objective">
      퓨즈 3개를 찾아 발전기를 가동하세요.
    </div>

    <div id="mobileControls">
      <div class="joy" id="joy">
        <div class="knob" id="knob"></div>
      </div>

      <button class="runBtn" id="runButton">달리기</button>

      <div class="mButtons">
        <button id="interactButton">상호작용</button>
        <button id="flashButton">손전등</button>
        <button id="exitGameButton">메뉴</button>
      </div>
    </div>

    <div id="startOverlay">
      <div class="overlaycard">
        <h2 id="overlayTitle">작전 종료</h2>
        <p id="overlayText"></p>
        <button id="backLobbyBtn">대기실로</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const $ = id => document.getElementById(id);

let selectedColor = '#54d6ff';
let socket = null;
let myId = null;
let room = null;
let isHost = false;
let started = false;

let scene, camera, renderer, clock;
let playerGroup, monsterMesh, flashlight;
let flashOn = true;

let local = {
  x: -2,
  z: 15,
  yaw: 0,
  pitch: 0,
  hp: 100,
  alive: true
};

let keys = {};
let lastSend = 0;
let lastInteract = 0;
let toastTimer = 0;
let mobileRun = false;

let joy = {
  active: false,
  id: null,
  cx: 0,
  cy: 0,
  x: 0,
  y: 0
};

let look = {
  active: false,
  id: null,
  x: 0,
  y: 0
};

const avatarMeshes = new Map();
const objectiveMeshes = [];

const FUSE_POSITIONS = [
  [-11, 7],
  [11, 4],
  [-8, -10]
];

const colliders = [];

$('colors').addEventListener('click', e => {
  const button = e.target.closest('button[data-color]');
  if (!button) return;

  selectedColor = button.dataset.color;

  [...$('colors').querySelectorAll('button')].forEach(b => {
    b.style.outline = b === button
      ? '2px solid white'
      : 'none';
  });
});

$('createBtn').onclick = () => sendLobby('create_room');
$('joinBtn').onclick = () => sendLobby('join_room');

$('joinCode').addEventListener('input', e => {
  e.target.value = e.target.value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, '')
    .slice(0, 5);
});

$('startBtn').onclick = () => send({action:'start_game'});

$('leaveBtn').onclick = () => {
  send({action:'leave_room'});
  showMainMenu();
};

$('exitGameButton').onclick = () => {
  send({action:'leave_room'});
  started = false;
  room = null;
  $('game').style.display = 'none';
  showMainMenu();
};

$('backLobbyBtn').onclick = () => {
  $('startOverlay').style.display = 'none';
  $('game').style.display = 'none';
  started = false;

  if (isHost) {
    send({action:'restart_room'});
    $('menu').style.display = 'flex';
    $('lobbySection').classList.remove('hidden');
    $('mainMenu').classList.add('hidden');
  } else {
    send({action:'leave_room'});
    room = null;
    showMainMenu();
  }
};

$('interactButton').onclick = interact;
$('flashButton').onclick = toggleFlash;

$('runButton').onpointerdown = () => mobileRun = true;
$('runButton').onpointerup =
$('runButton').onpointercancel = () => mobileRun = false;

function send(data) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(data));
  }
}

function sendLobby(action) {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    connect(action);
    return;
  }

  sendLobbyAction(action);
}

let pendingAction = null;

function connect(action) {
  pendingAction = action;

  const protocol =
    location.protocol === 'https:' ? 'wss:' : 'ws:';

  socket = new WebSocket(
    `${protocol}//${location.host}/ws`
  );

  socket.onopen = () => {
    if (pendingAction) {
      sendLobbyAction(pendingAction);
      pendingAction = null;
    }
  };

  socket.onmessage = event => {
    let data;

    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    handleMessage(data);
  };

  socket.onclose = () => {
    showMessage('서버 연결이 끊어졌습니다. 새로고침해 주세요.');
    started = false;
  };

  socket.onerror = () => {
    showMessage('서버 연결에 실패했습니다. Render 상태를 확인하세요.');
  };
}

function sendLobbyAction(action) {
  const data = {
    action,
    name: $('playerName').value.trim() || '생존자',
    color: selectedColor,
    outfit: $('outfit').value
  };

  if (action === 'join_room') {
    data.code = $('joinCode').value.trim();
  }

  send(data);
}

function showMessage(message) {
  $('menuMessage').textContent = message;
  showToast(message);
}

function showMainMenu() {
  $('menu').style.display = 'flex';
  $('mainMenu').classList.remove('hidden');
  $('lobbySection').classList.add('hidden');
  $('characterSection').classList.remove('hidden');
}

function showToast(message) {
  $('toast').textContent = message;
  toastTimer = 2.5;
}

function handleMessage(data) {
  if (data.type === 'connected') {
    myId = data.id;
    return;
  }

  if (data.type === 'error') {
    showMessage(data.message);
    return;
  }

  if (
    data.type === 'room_created' ||
    data.type === 'joined_room'
  ) {
    $('roomCode').textContent = data.code;
    $('mainMenu').classList.add('hidden');
    $('characterSection').classList.add('hidden');
    $('lobbySection').classList.remove('hidden');
    $('menuMessage').textContent = '';
  }

  if (data.type === 'left_room') {
    room = null;
    return;
  }

  if (data.type === 'room_state') {
    room = data.room;
    isHost = room.host === myId;

    renderLobby();

    if (room.started && !started) {
      startGame();
    }

    if (!room.started && started) {
      started = false;
      $('game').style.display = 'none';
      $('menu').style.display = 'flex';
      $('lobbySection').classList.remove('hidden');
      $('mainMenu').classList.add('hidden');
    }

    if (room.started) {
      applyNetworkState();
    }
  }
}

function renderLobby() {
  if (!room) return;

  $('roomCode').textContent = room.code;

  $('lobbyPlayers').innerHTML = room.players.map(p => `
    <span class="playerpill" style="border-color:${p.color}">
      ${p.host ? '👑 ' : ''}
      ${escapeHtml(p.name)} · ${escapeHtml(p.outfit)}
    </span>
  `).join('');

  $('startBtn').disabled = !isHost || room.started;

  $('startBtn').textContent = isHost
    ? '게임 시작'
    : '방장 시작 대기 중';

  $('hostHint').textContent = isHost
    ? '당신은 방장입니다. 혼자서도 시작할 수 있습니다.'
    : '방장이 시작할 때까지 기다려 주세요.';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function init3D() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030609);
  scene.fog = new THREE.FogExp2(0x030609, 0.035);

  camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    100
  );

  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  $('game').prepend(renderer.domElement);
  renderer.domElement.style.touchAction = 'none';

  scene.add(
    new THREE.HemisphereLight(0x9bb6c4, 0x101217, 1.2)
  );

  const roomLight = new THREE.PointLight(0x6ebbd2, 1.5, 24);
  roomLight.position.set(0, 4, 0);
  scene.add(roomLight);

  flashlight = new THREE.SpotLight(
    0xc9f5ff,
    35,
    22,
    Math.PI / 7,
    0.45,
    1.2
  );

  camera.add(flashlight);
  flashlight.position.set(0, 0, 0);

  flashlight.target.position.set(0, 0, -1);
  camera.add(flashlight.target);
  scene.add(camera);

  buildMap();
  buildAvatar();

  clock = new THREE.Clock();

  window.addEventListener('resize', onResize);

  renderer.domElement.addEventListener('click', () => {
    if (!isMobile()) {
      renderer.domElement.requestPointerLock?.();
    }
  });

  document.addEventListener('mousemove', event => {
    if (document.pointerLockElement === renderer.domElement) {
      local.yaw -= event.movementX * 0.0024;
      local.pitch -= event.movementY * 0.0024;

      local.pitch = Math.max(
        -1.35,
        Math.min(1.35, local.pitch)
      );
    }
  });

  renderer.domElement.addEventListener('pointerdown', event => {
    if (
      isMobile() &&
      event.pointerType === 'touch' &&
      !isUI(event.target)
    ) {
      look.active = true;
      look.id = event.pointerId;
      look.x = event.clientX;
      look.y = event.clientY;
    }
  });

  renderer.domElement.addEventListener('pointermove', event => {
    if (look.active && event.pointerId === look.id) {
      local.yaw -= (event.clientX - look.x) * 0.006;
      local.pitch -= (event.clientY - look.y) * 0.006;

      local.pitch = Math.max(
        -1.35,
        Math.min(1.35, local.pitch)
      );

      look.x = event.clientX;
      look.y = event.clientY;
    }
  });

  renderer.domElement.addEventListener('pointerup', event => {
    if (event.pointerId === look.id) {
      look.active = false;
    }
  });

  animate();
}

function isMobile() {
  return matchMedia('(pointer: coarse)').matches ||
    innerWidth < 800;
}

function isUI(element) {
  return Boolean(
    element.closest('button,.joy,.mButtons,.runBtn')
  );
}

function mat(color, roughness = 0.8) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

function addBox(x,y,z,sx,sy,sz,color,solid=true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    mat(color)
  );

  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  if (solid) {
    colliders.push({x,z,sx,sz});
  }

  return mesh;
}

function buildMap() {
  addBox(0,-0.3,0,38,0.6,38,0x1a2429,false);

  addBox(0,2,-19,38,4,0.5,0x273239);
  addBox(0,2,19,38,4,0.5,0x273239);
  addBox(-19,2,0,0.5,4,38,0x273239);
  addBox(19,2,0,0.5,4,38,0x273239);

  addBox(-5,1.6,-7,0.5,3,14,0x26343b);
  addBox(6,1.6,5,0.5,3,14,0x26343b);

  addBox(0,1.6,9,10,0.3,0.4,0x36434a,false);
  addBox(0,1,0,2,2,1.6,0x40545b,false);
  addBox(0,1.5,-18.2,4,3,0.35,0x4b5960,false);

  FUSE_POSITIONS.forEach((position,index) => {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.35,0.35,0.35),
      new THREE.MeshStandardMaterial({
        color: 0xffd166,
        emissive: 0x8a4d00,
        emissiveIntensity: 1.3
      })
    );

    mesh.position.set(position[0],0.4,position[1]);
    scene.add(mesh);

    objectiveMeshes.push({
      type:'fuse',
      index,
      mesh,
      pos:position
    });
  });

  const key = new THREE.Mesh(
    new THREE.BoxGeometry(0.35,0.1,0.5),
    new THREE.MeshStandardMaterial({
      color:0x54d6ff,
      emissive:0x005b77,
      emissiveIntensity:1.5
    })
  );

  key.position.set(12,0.25,-11);
  scene.add(key);

  objectiveMeshes.push({
    type:'keycard',
    mesh:key,
    pos:[12,-11]
  });

  const exit = new THREE.Mesh(
    new THREE.BoxGeometry(2,2,0.25),
    new THREE.MeshStandardMaterial({
      color:0x225d64,
      emissive:0x0b3941,
      emissiveIntensity:0.8
    })
  );

  exit.position.set(0,1,-17);
  scene.add(exit);

  objectiveMeshes.push({
    type:'exit',
    mesh:exit,
    pos:[0,-17]
  });

  for (const [x,z] of [
    [-12,-12],
    [12,-12],
    [-12,12],
    [12,12],
    [0,0]
  ]) {
    const lamp = new THREE.PointLight(0x4da3b4,1.1,9);
    lamp.position.set(x,2.8,z);
    scene.add(lamp);

    addBox(x,3,z,0.3,0.12,0.3,0x8ddde6,false);
  }
}

function buildAvatar() {
  playerGroup = new THREE.Group();

  const torso = new THREE.Mesh(
    new THREE.BoxGeometry(0.55,0.75,0.28),
    mat(selectedColor)
  );

  torso.position.y = 1.15;
  playerGroup.add(torso);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.22,12,10),
    mat(0xc6a58d)
  );

  head.position.y = 1.72;
  playerGroup.add(head);

  for (const x of [-0.17,0.17]) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.19,0.55,0.22),
      mat(0x202a31)
    );

    leg.position.set(x,0.42,0);
    playerGroup.add(leg);
  }

  const backpack = new THREE.Mesh(
    new THREE.BoxGeometry(0.35,0.48,0.18),
    mat(0x263b39)
  );

  backpack.position.set(0,1.2,0.22);
  playerGroup.add(backpack);

  scene.add(playerGroup);
}

function buildOtherAvatar(player) {
  const group = new THREE.Group();

  const torso = new THREE.Mesh(
    new THREE.BoxGeometry(0.55,0.75,0.28),
    mat(player.color || 0x54d6ff)
  );

  torso.position.y = 1.15;
  group.add(torso);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.22,12,10),
    mat(0xc6a58d)
  );

  head.position.y = 1.72;
  group.add(head);

  for (const x of [-0.17,0.17]) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.19,0.55,0.22),
      mat(0x202a31)
    );

    leg.position.set(x,0.42,0);
    group.add(leg);
  }

  scene.add(group);
  return group;
}

function applyNetworkState() {
  if (!room || !started || !room.mission) return;

  const mission = room.mission;
  const me = room.players.find(p => p.id === myId);

  if (me) {
    // 네트워크 갱신 때 내 위치를 덮어쓰지 않아
    // WASD 이동이 끊기는 현상을 방지한다.
    local.hp = me.hp || 100;
    local.alive = me.alive !== false;

    $('hpText').textContent =
      `체력: ${local.hp}${local.alive ? '' : ' · 의식 없음'}`;
  }

  const present = new Set();

  for (const player of room.players) {
    if (player.id === myId) continue;

    present.add(player.id);

    let group = avatarMeshes.get(player.id);

    if (!group) {
      group = buildOtherAvatar(player);
      avatarMeshes.set(player.id, group);
    }

    group.position.set(player.x,0,player.z);
    group.rotation.y = player.yaw || 0;
  }

  for (const [id,group] of avatarMeshes) {
    if (!present.has(id)) {
      scene.remove(group);
      avatarMeshes.delete(id);
    }
  }

  if (monsterMesh) {
    monsterMesh.position.set(
      mission.monster.x,
      0,
      mission.monster.z
    );
  }

  objectiveMeshes.forEach(objective => {
    if (objective.type === 'fuse') {
      objective.mesh.visible =
        !mission.fuses.includes(objective.index);
    }

    if (objective.type === 'keycard') {
      objective.mesh.visible = !mission.keycard;
    }

    if (objective.type === 'exit') {
      objective.mesh.material.color.set(
        mission.generator && mission.keycard
          ? 0x55ff99
          : 0x225d64
      );
    }
  });

  const text =
    `퓨즈 ${mission.fuses.length}/3 · ` +
    `발전기 ${mission.generator ? '가동' : '정지'} · ` +
    `키카드 ${mission.keycard ? '확보' : '미확보'}`;

  $('missionText').textContent = text;
  $('objective').textContent = mission.message || text;

  if (mission.escaped.includes(myId)) {
    showOverlay(
      '탈출 성공',
      '격리구역에서 탈출했습니다.'
    );
  }
}

function startGame() {
  started = true;

  $('menu').style.display = 'none';
  $('game').style.display = 'block';
  $('startOverlay').style.display = 'none';

  if (!renderer) {
    init3D();
  }

  local.x = -2;
  local.z = 15;
  local.hp = 100;
  local.alive = true;

  if (!monsterMesh) {
    monsterMesh = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.85,1.8,0.55),
      mat(0x160c10)
    );

    body.position.y = 1;
    monsterMesh.add(body);

    const eyes = new THREE.Mesh(
      new THREE.BoxGeometry(0.25,0.1,0.08),
      new THREE.MeshBasicMaterial({color:0xff172b})
    );

    eyes.position.set(0,1.45,-0.29);
    monsterMesh.add(eyes);

    scene.add(monsterMesh);
  }

  camera.position.set(local.x,1.62,local.z);
  camera.rotation.set(local.pitch,local.yaw,0,'YXZ');

  showToast('격리구역에 진입했습니다. 퓨즈 3개를 찾으세요.');
  applyNetworkState();
}

function showOverlay(title,text) {
  $('startOverlay').style.display = 'flex';
  $('overlayTitle').textContent = title;
  $('overlayText').textContent = text;
}

function onResize() {
  if (!camera || !renderer) return;

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function blocked(x,z) {
  if (
    x < -17.2 || x > 17.2 ||
    z < -17.2 || z > 17.2
  ) {
    return true;
  }

  const blocks = [
    {x:-5,z:-7,sx:0.5,sz:14},
    {x:6,z:5,sx:0.5,sz:14}
  ];

  return blocks.some(block =>
    Math.abs(x-block.x) < block.sx/2+0.38 &&
    Math.abs(z-block.z) < block.sz/2+0.38
  );
}

function animate() {
  requestAnimationFrame(animate);

  if (!renderer || !started) return;

  const dt = Math.min(clock.getDelta(),0.05);

  if (local.alive) {
    let forward =
      (keys.KeyW || keys.ArrowUp ? 1 : 0) -
      (keys.KeyS || keys.ArrowDown ? 1 : 0) -
      joy.y;

    let side =
      (keys.KeyD || keys.ArrowRight ? 1 : 0) -
      (keys.KeyA || keys.ArrowLeft ? 1 : 0) +
      joy.x;

    const length = Math.hypot(forward,side);

    if (length > 1) {
      forward /= length;
      side /= length;
    }

    const running =
      keys.ShiftLeft || keys.ShiftRight || mobileRun;

    const speed = running ? 5.5 : 3.3;

    const dx = (
      -Math.sin(local.yaw) * forward +
      Math.cos(local.yaw) * side
    ) * speed * dt;

    const dz = (
      -Math.cos(local.yaw) * forward -
      Math.sin(local.yaw) * side
    ) * speed * dt;

    if (!blocked(local.x+dx,local.z)) {
      local.x += dx;
    }

    if (!blocked(local.x,local.z+dz)) {
      local.z += dz;
    }
  }

  camera.position.set(
    local.x,
    local.alive ? 1.62 : 0.8,
    local.z
  );

  camera.rotation.set(
    local.pitch,
    local.yaw,
    0,
    'YXZ'
  );

  if (playerGroup) {
    playerGroup.position.set(local.x,0,local.z);
    playerGroup.rotation.y = local.yaw;
  }

  const now = performance.now();

  if (now-lastSend > 60) {
    send({
      action:'move',
      x:local.x,
      z:local.z,
      yaw:local.yaw
    });

    lastSend = now;
  }

  if (toastTimer > 0) {
    toastTimer -= dt;

    if (toastTimer <= 0) {
      $('toast').textContent = '';
    }
  }

  renderer.render(scene,camera);
}

document.addEventListener('keydown',event => {
  if ([
    'KeyW','KeyA','KeyS','KeyD',
    'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
    'Space'
  ].includes(event.code)) {
    event.preventDefault();
  }

  keys[event.code] = true;

  if (event.code === 'KeyE') interact();
  if (event.code === 'KeyF') toggleFlash();
});

document.addEventListener('keyup',event => {
  keys[event.code] = false;
});

window.addEventListener('blur',() => {
  keys = {};
  mobileRun = false;
});

function toggleFlash() {
  flashOn = !flashOn;

  if (flashlight) {
    flashlight.visible = flashOn;
  }

  showToast(flashOn ? '손전등 켜짐' : '손전등 꺼짐');
}

function interact() {
  if (!started || !room || !room.mission) return;

  const now = performance.now();

  if (now-lastInteract < 450) return;

  lastInteract = now;

  const mission = room.mission;

  const nearObj = (position,radius=2.7) =>
    Math.hypot(
      local.x-position[0],
      local.z-position[1]
    ) < radius;

  const fuseIndex = FUSE_POSITIONS.findIndex(
    (position,index) =>
      !mission.fuses.includes(index) &&
      nearObj(position)
  );

  if (fuseIndex >= 0) {
    send({action:'interact',item:'fuse'});
    showToast('퓨즈를 확보하는 중...');
    return;
  }

  if (
    mission.fuses.length === 3 &&
    !mission.generator &&
    nearObj([0,0],3.2)
  ) {
    send({action:'interact',item:'generator'});
    showToast('발전기를 가동합니다...');
    return;
  }

  if (
    !mission.keycard &&
    nearObj([12,-11])
  ) {
    send({action:'interact',item:'keycard'});
    showToast('키카드를 확보합니다...');
    return;
  }

  if (
    mission.generator &&
    mission.keycard &&
    nearObj([0,-17],3.2)
  ) {
    send({action:'interact',item:'exit'});
    showToast('출구를 개방합니다...');
    return;
  }

  showToast('주변에 상호작용할 물체가 없습니다.');
}

// 모바일 가상 조이스틱
$('joy').addEventListener('pointerdown',event => {
  joy.active = true;
  joy.id = event.pointerId;

  const rect = $('joy').getBoundingClientRect();

  joy.cx = rect.left + rect.width/2;
  joy.cy = rect.top + rect.height/2;

  $('joy').setPointerCapture(event.pointerId);
  updateJoy(event);
});

$('joy').addEventListener('pointermove',event => {
  if (joy.active && event.pointerId === joy.id) {
    updateJoy(event);
  }
});

function updateJoy(event) {
  let dx = event.clientX - joy.cx;
  let dy = event.clientY - joy.cy;

  const max = 43;
  const length = Math.hypot(dx,dy);

  if (length > max) {
    dx = dx/length*max;
    dy = dy/length*max;
  }

  joy.x = dx/max;
  joy.y = dy/max;

  $('knob').style.transform =
    `translate(${dx}px,${dy}px)`;
}

function resetJoy() {
  joy.active = false;
  joy.x = 0;
  joy.y = 0;

  $('knob').style.transform = 'translate(0,0)';
}

$('joy').addEventListener('pointerup',resetJoy);
$('joy').addEventListener('pointercancel',resetJoy);
</script>
